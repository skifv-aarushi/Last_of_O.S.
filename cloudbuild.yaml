steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/yantra-game-server', '.']

  # 2. Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/yantra-game-server']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'yantra-game-server'
      - '--image'
      - 'gcr.io/$PROJECT_ID/yantra-game-server'
      - '--region'
      - 'asia-southeast1' # Updated to match your previous region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'FIREBASE_DATABASE_URL=${_FIREBASE_DATABASE_URL}'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--memory'
      - '512Mi'

images:
  - 'gcr.io/$PROJECT_ID/yantra-game-server'

substitutions:
  # Your actual Firebase URL
  _FIREBASE_DATABASE_URL: 'https://last-of-os-485319-default-rtdb.firebaseio.com'

options:
  logging: CLOUD_LOGGING_ONLY